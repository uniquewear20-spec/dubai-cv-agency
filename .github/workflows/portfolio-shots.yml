# Temporary helper: captures screenshots of the two live portfolios for the gallery previews.
name: Portfolio screenshots
on:
  push:
    paths: [".github/workflows/portfolio-shots.yml", "tools/portfolio-shots.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture
        run: NODE_PATH=/tmp/pw/node_modules OUT=tools/portfolio-captures node tools/portfolio-shots.mjs
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/portfolio-captures
          git commit -m "Capture screenshots of the two live portfolios [skip ci]" || echo "nothing to commit"
          git push
